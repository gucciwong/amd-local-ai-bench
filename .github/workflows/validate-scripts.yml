name: validate-scripts

# 脚本本身也要有检查。submissions 的校验器再严，
# 也拦不住 quick-image.ps1 被改坏。
#
# PSScriptAnalyzer 默认规则里有几条对本仓库不适用（见下方 -ExcludeRule），
# 排除掉是因为它们与脚本的实际用途冲突，不是为了让 CI 变绿。

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/validate-scripts.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Analyze
        shell: pwsh
        run: |
          # 每条排除都是逐一核实过的，不是为了让 CI 变绿：
          #
          # PSAvoidUsingWriteHost
          #   这些是交互式脚本，进度输出就是给人看的，不是日志。
          # PSUseShouldProcessForStateChangingFunctions
          #   脚本不做破坏性操作，不需要 -WhatIf 支持。
          # PSUseUsingScopeModifierInNewRunspaces
          #   误报。collect.ps1 的 Start-Job 用的是 param() + -ArgumentList，
          #   分析器不认这种传参方式，只看到块内的裸变量名。
          # PSUseBOMForUnicodeEncodedFile
          #   纯风格问题。加 BOM 反而会让某些工具链读文件时出错。
          # PSAvoidUsingEmptyCatchBlock
          #   两处都是有意的 best-effort：卸载常驻模型失败不该中断出图，
          #   读取进度清单失败应退化为从头跑。均在代码里注明。
          $exclude = @(
            'PSAvoidUsingWriteHost',
            'PSUseShouldProcessForStateChangingFunctions',
            'PSUseUsingScopeModifierInNewRunspaces',
            'PSUseBOMForUnicodeEncodedFile',
            'PSAvoidUsingEmptyCatchBlock'
          )
          $issues = Invoke-ScriptAnalyzer -Path scripts -Recurse -ExcludeRule $exclude

          if ($issues) {
            $issues | Format-Table -AutoSize RuleName, Severity, Line, ScriptName, Message
          }

          # 只有 Error 判红。Warning 打印出来供参考，不阻塞。
          $errors = @($issues | Where-Object Severity -eq 'Error')
          if ($errors.Count -gt 0) {
            Write-Error "$($errors.Count) 个 Error 级问题"
            exit 1
          }
          Write-Host "PowerShell 脚本检查通过（$(@($issues).Count) 个非阻塞警告）"

      - name: Syntax check every script parses
        shell: pwsh
        run: |
          # Analyzer 跑过不代表能解析 —— 显式再确认一次
          $bad = 0
          Get-ChildItem scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              Write-Host "解析失败: $($_.Name)"
              $errors | ForEach-Object { Write-Host "  $($_.Message)" }
              $bad++
            }
          }
          if ($bad -gt 0) { exit 1 }
          Write-Host "全部 .ps1 解析通过"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile check
        run: python -m compileall -q scripts

      - name: Lint
        run: |
          pip install --quiet ruff
          # collect.py 里有平台分支，Linux 上跑不到 Windows 那半边，
          # 所以只做静态检查，不做导入时执行
          ruff check scripts --select E9,F63,F7,F82
